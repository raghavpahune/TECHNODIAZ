version: '3.8'

services:
  app:
    build: .
    container_name: technodiaz-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=technodiaz_nature_meets_innovation_super_secret_jwt_key_2026!
      - MONGODB_URI=mongodb://mongo:27017/technodiaz2k26
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: technodiaz-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
